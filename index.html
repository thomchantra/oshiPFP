<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141414" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Tune drawing into a PFP. Crop, tweak line art, color grade, and export from your browser." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicondark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>oshiPFP</title>

    <!-- Link-preview metadata (what Discord/Slack/Twitter/iMessage etc. show
         when this URL is pasted/shared) — edit the title/description text
         here directly. og:image/og:url need the real deploy domain filled in
         once you have it (Netlify assigns one, or your custom domain) —
         these are placeholders and won't produce a working preview until
         then, since crawlers fetch og:image as an absolute URL independent
         of the page. og:image points at public/og-image.jpg — swap
         REPLACE_WITH_DEPLOY_DOMAIN (both spots below) for the real domain
         once you have one. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="oshiPFP" />
    <meta property="og:description" content="Tune drawing into a PFP. Crop, tweak line art, color grade, and export from your browser." />
    <meta property="og:image" content="https://oshipfp.netlify.app/og-image.jpg" />
    <meta property="og:url" content="https://oshipfp.netlify.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="oshiPFP" />
    <meta name="twitter:description" content="Tune drawing into a PFP. Crop, tweak line art, color grade, and export from your browser." />
    <meta name="twitter:image" content="https://oshipfp.netlify.app/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
