<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>oshiPFP lab</title>
    <style>
      /* Pin the lab harness to the viewport — LabApp.tsx's own layout
         handles scrolling internally (sidebar scrolls, preview stays
         fixed), so the page itself must never scroll or this default
         body margin/overflow would add a second, redundant scrollbar. */
      html, body, #root {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/lab/main.tsx"></script>
  </body>
</html>
